[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falsealarm"
version = "1.0.0"
description = "Async Web Reconnaissance Engine for Pentesters & Bug Bounty Hunters"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "reikageisme"}]
keywords = ["pentesting", "reconnaissance", "security", "bug-bounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "typer[all]>=0.12",
    "rich>=13.0",
    "dnspython>=2.6",
    "websockets>=12.0",
    "beautifulsoup4>=4.12",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "certifi",
    "python-dotenv>=1.0.0",
]

[project.scripts]
falsealarm = "falsealarm.cli:main"

[tool.setuptools.packages.find]
include = ["falsealarm*"]

[tool.setuptools.package-data]
falsealarm = ["data/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Pyflakes (F) + a subset of pycodestyle (E/W) + isort (I).
select = ["E", "F", "W", "I"]
# E402/E701/E501 are stylistic and pervasive in this codebase's CLI and
# one-line guard clauses; keep them off so lint stays signal, not noise.
ignore = ["E402", "E701", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# Gradual typing: don't fail the build on untyped defs yet.
check_untyped_defs = false
