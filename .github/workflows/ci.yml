name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and dev dependencies
        run: python -m pip install -e . -r requirements-dev.txt

      - name: Ruff (lint + import order)
        run: ruff check falsealarm tests

      - name: Mypy (type-check, advisory)
        run: mypy falsealarm
        continue-on-error: true

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e . -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python package
        run: python -m compileall -q falsealarm

  go-engine:
    name: Go engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
          cache-dependency-path: engine-go/go.sum

      - name: Test Go engine
        working-directory: engine-go
        run: go test ./...

      - name: Build Go engine
        working-directory: engine-go
        run: go build -o dirfuzz-engine dirfuzz.go
