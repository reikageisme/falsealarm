name: Release

# Publish artifacts when a version tag is pushed, e.g. `git tag v1.0.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Releases / upload assets
  packages: write   # push Docker image to GHCR
  id-token: write   # PyPI Trusted Publishing (OIDC)

jobs:
  go-binaries:
    name: Go engine (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
          cache-dependency-path: engine-go/go.sum

      - name: Build dirfuzz engine
        working-directory: engine-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "dirfuzz-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" dirfuzz.go

      - name: Upload binary to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: engine-go/dirfuzz-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  pypi:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # Configure a Trusted Publisher for this repo on PyPI first:
        # https://docs.pypi.org/trusted-publishers/

  docker:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
